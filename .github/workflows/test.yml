name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install zstd CLI
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Run type check
        run: pnpm tsgo

      - name: Run linter
        run: pnpm check

      - name: Run tests
        run: pnpm vitest

      - name: Run differential harness (required)
        run: pnpm vitest packages/zstdify-tests/src/differential/differential.test.ts packages/zstdify-tests/src/interop/zstd-cli-interop.test.ts
